name: Build NextBSD Kernel Extensions
on:
  # A chain run: nextbsd-kernel published a new kernel (freebsd-src's daily sync
  # when releng/15.1 moves, or its Sync Fork with `force`). A kernel merge alone
  # does not dispatch (nextbsd-kernel#324); rebuild by hand then.
  repository_dispatch:
    types: [kernel-updated]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'tools/**'
      - 'data/**'
      - '*/kext.env'
      - '*/Makefile'
      - '*/src/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'tools/**'
      - 'data/**'
      - '*/kext.env'
      - '*/Makefile'
      - '*/src/**'
  workflow_dispatch:
    inputs:
      fbsd_sha:
        description: 'Pinned FreeBSD SHA for the toolchain image tag (blank = latest)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # linux-firmware release the bundled firmware comes from (KEXT_FIRMWARE).
  LINUX_FIRMWARE_TAG: "20260519"

jobs:
  # The FreeBSD-derived kexts (E21, nextbsd/nextbsd#554). Each top-level
  # directory with a kext.env is one kext; tools/kexts.sh reads them, so this
  # workflow names no kext, module or source path. Moved from
  # nextbsd-kernel-extensions-graphics' `modules` job and its IntelWiFi and
  # IntelEthernet publish steps, which built the whole module tree and shipped
  # it as nextbsd-modules-<arch>.tar.gz. This builds only the modules a kext
  # ships (MODULES_OVERRIDE) and publishes only kexts.
  #
  # A kext ships on the arches its kext.env lists; each arch builds and
  # publishes its own set, freebsd-kexts-<arch>.tar.gz.
  modules:
    name: modules (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            target_arch: amd64
          - target: arm64
            target_arch: aarch64
    container:
      # Same per-arch toolchain image the kernel was built in, by tag only.
      # Cross-builds on the x86_64 runner (no emulation).
      image: ghcr.io/nextbsd/nextbsd-toolchain:${{ matrix.target }}-${{ (github.event.client_payload.fbsd_sha || inputs.fbsd_sha) && format('fbsd-{0}', github.event.client_payload.fbsd_sha || inputs.fbsd_sha) || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: nbkx

      # The kernel SDK from nextbsd-kernel's `continuous` release
      # (nextbsd-kernel#327): the kernel's headers, generated options,
      # KERNEL-BUILD-ID and its version and kext ABI version (nextbsd-kernel#376;
      # the build ID stands in for both on an older SDK). No kernel source or
      # obj tree, no relink (#2). Leaves the ID and versions in
      # /tmp/kernel-build-id and KERNEL_SDK in the environment.
      - name: Kernel SDK
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_SHA: ${{ github.event.client_payload.sha }}
        run: nbkx/tools/fetch-kernel-sdk.sh ${{ matrix.target }}

      # buildenv needs the host build tools (bmake, the legacy and bootstrap
      # tools) that make.py builds into /usr/obj. They come from the toolchain
      # image's freebsd-src, not from the kernel.
      - name: Host build tools
        run: |
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET="${{ matrix.target }}" \
            TARGET_ARCH="${{ matrix.target_arch }}" \
            kernel-toolchain -j"$(nproc)"

      # The SYSDIR the modules build against: freebsd-src's sys/ (module source,
      # some of which Makefiles take from ${SYSDIR}) with the kernel SDK's sys/
      # laid over it, so every header and kmod.mk input is the kernel's own
      # (patched) one. /usr/src is the toolchain image's throwaway copy.
      - name: Lay the kernel SDK over the source tree
        run: cp -R "$KERNEL_SDK/sys/." /usr/src/sys/

      # Every kext's module in one pass, from sys/modules: SYSDIR as above,
      # KERNBUILDDIR the SDK's opt_*.h and opt_global.h, as buildkernel would
      # pass. -k keeps going past a module that fails, so one run reports every
      # failure (the inputs step names the modules that were not built).
      - name: Build the kexts' modules
        run: |
          MODS=$(nbkx/tools/kexts.sh modules ${{ matrix.target }})
          echo "$(echo $MODS | wc -w) sys/modules directories"
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET="${{ matrix.target }}" \
            TARGET_ARCH="${{ matrix.target_arch }}" \
            buildenv BUILDENV_SHELL="make -k -C /usr/src/sys/modules -j$(nproc) MODULES_OVERRIDE='$MODS' SYSDIR=/usr/src/sys KERNBUILDDIR=$KERNEL_SDK/obj" || true

      # Kexts built from this repo's own Makefiles: the net80211 family and the
      # vendored Realtek driver.
      - name: Build the local modules
        run: |
          for d in $(nbkx/tools/kexts.sh local ${{ matrix.target }}); do
            echo "==> $d"
            (cd /usr/src && ./tools/build/make.py \
              --cross-bindir="${CROSS_BINDIR}" \
              TARGET="${{ matrix.target }}" \
              TARGET_ARCH="${{ matrix.target_arch }}" \
              buildenv BUILDENV_SHELL="make -C $d -j$(nproc) SRCTOP=/usr/src SYSDIR=/usr/src/sys KERNBUILDDIR=$KERNEL_SDK/obj") || true
          done

      # Each kext's module, its metadata (kldxref: MODULE_DEPEND, MODULE_PNP_INFO)
      # and any hand-written personalities. kldxref is the host build tool the
      # cross build bootstraps; it reads modules of either arch.
      - name: Collect each kext's module and metadata
        run: |
          KLDXREF=$(find /usr/obj -path '*/tmp/legacy/*' -name kldxref -type f 2>/dev/null | head -1)
          [ -n "$KLDXREF" ] || KLDXREF=$(command -v kldxref || true)
          [ -n "$KLDXREF" ] || { echo "no host kldxref; candidates:" >&2; find / -name 'kldxref*' -type f 2>/dev/null | head >&2; exit 1; }
          echo "kldxref: $KLDXREF"
          export KLDXREF
          nbkx/tools/kexts.sh inputs ${{ matrix.target }} /usr/src /usr/obj kext-inputs
          cp /tmp/kernel-build-id/KERNEL-BUILD-ID /tmp/kernel-build-id/KERNEL-ABI-VERSION kext-inputs/
          cp "$KERNEL_SDK/kernel.symbols" kext-inputs/
          # Module versions compiled into the kernel (nextbsd-kernel#362), for
          # wrap's MODULE_DEPEND check and System.kext (#5), and the kernel
          # version, System.kext's CFBundleVersion: the SDK's KERNEL-VERSION
          # (27.0.0, nextbsd-kernel#376), or newvers.sh's REVISION (15.1) from
          # an SDK that predates it.
          cp "$KERNEL_SDK/kernel.modules" kext-inputs/
          if [ -s "$KERNEL_SDK/KERNEL-VERSION" ]; then
            tr -d ' \t\r\n' < "$KERNEL_SDK/KERNEL-VERSION" > kext-inputs/kernel.version
            [ -s kext-inputs/kernel.version ] || { echo "the SDK's KERNEL-VERSION is empty" >&2; exit 1; }
          else
            sed -n 's/^REVISION="\([0-9.]*\)"$/\1/p' "$KERNEL_SDK/sys/conf/newvers.sh" > kext-inputs/kernel.version
            [ -s kext-inputs/kernel.version ] || { echo "no KERNEL-VERSION in the SDK and no REVISION in its newvers.sh" >&2; exit 1; }
          fi
          echo "System.kext version: $(cat kext-inputs/kernel.version)"

      - name: Upload kext inputs
        uses: actions/upload-artifact@v4
        with:
          name: kext-inputs-${{ matrix.target }}
          path: kext-inputs
          if-no-files-found: error

  kexts:
    name: kexts (${{ matrix.target }})
    needs: modules
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kext inputs
        uses: actions/download-artifact@v4
        with:
          name: kext-inputs-${{ matrix.target }}
          path: kext-inputs

      # Bundle firmware, inject personalities, stamp NBSDKernelABIVersion and
      # NBSDKernelBuildID, and write System.kext.
      - name: Wrap the kexts
        run: tools/kexts.sh wrap ${{ matrix.target }} kext-inputs kexts

      - name: Validate the kext bundles
        run: |
          python3 - kexts "$(cat kext-inputs/KERNEL-ABI-VERSION)" "$(cat kext-inputs/KERNEL-BUILD-ID)" "$(cat kext-inputs/kernel.version)" <<'PY'
          import os, plistlib, sys
          root, kabi, kbid, kver = sys.argv[1:5]
          names = sorted(n for n in os.listdir(root) if n.endswith('.kext'))
          assert names, "no kexts"
          kinds = {}
          for n in names:
              d = plistlib.load(open(f"{root}/{n}/Contents/Info.plist", 'rb'))
              if d.get('OSKernelResource'):
                  # System.kext (#5): codeless, the kernel's own description.
                  assert n == 'System.kext' and d['CFBundleIdentifier'] == 'org.nextbsd.kernel', n
                  assert 'CFBundleExecutable' not in d and not os.path.exists(f"{root}/{n}/Contents/MacOS"), f"{n}: has code"
                  assert d.get('NBSDKernelABIVersion') == kabi, f"{n}: NBSDKernelABIVersion {d.get('NBSDKernelABIVersion')} != {kabi}"
                  assert d.get('NBSDKernelBuildID') == kbid, f"{n}: NBSDKernelBuildID {d.get('NBSDKernelBuildID')} != {kbid}"
                  for k in ('CFBundleVersion', 'CFBundleShortVersionString', 'OSBundleCompatibleVersion'):
                      assert d.get(k) == kver, f"{n}: {k} {d.get(k)} != {kver}"
                  assert 'kernel' in d['NBSDModules'], f"{n}: no built-in modules"
                  print(f"{n}: {d['CFBundleIdentifier']} {d['CFBundleVersion']}; kernel resource, "
                        f"{len(d['NBSDModules'])} built-in modules")
                  continue
              exe = f"{root}/{n}/Contents/MacOS/{d['CFBundleExecutable']}"
              assert os.path.isfile(exe), f"{n}: no executable {exe}"
              assert d['CFBundleIdentifier'].startswith('org.nextbsd.'), d['CFBundleIdentifier']
              assert d.get('NBSDKernelABIVersion') == kabi, f"{n}: NBSDKernelABIVersion {d.get('NBSDKernelABIVersion')} != {kabi}"
              assert d.get('NBSDKernelBuildID') == kbid, f"{n}: NBSDKernelBuildID {d.get('NBSDKernelBuildID')} != {kbid}"
              pers = d.get('IOKitPersonalities', {})
              for p in pers.values():
                  assert p.get('CFBundleIdentifier') == d['CFBundleIdentifier'], f"{n}: personality for another bundle"
                  kinds[p['IOProviderClass']] = kinds.get(p['IOProviderClass'], 0) + 1
              provs = sorted({p['IOProviderClass'] for p in pers.values()})
              libs = sorted(d.get('OSBundleLibraries', {}))
              print(f"{n}: {d['CFBundleIdentifier']}; matches {', '.join(provs) or 'nothing (library or loaded on request)'}"
                    + (f"; needs {', '.join(libs)}" if libs else ""))
          assert 'System.kext' in names, "no System.kext"
          print(f"{len(names)} kexts; personalities by provider: {kinds}")
          PY

      # Every symbol a kext leaves undefined must be defined by the kernel (the
      # SDK's exported-symbol list) or by another kext in the set; otherwise it
      # builds and packages fine and then fails kldload with ENOEXEC (#6).
      - name: Check every kext resolves (no ENOEXEC at kldload)
        run: python3 tools/check-kext-symbols.py kext-inputs/kernel.symbols kexts

      # Only kexts go in the asset: it is unpacked straight into
      # /System/Library/Extensions.
      - name: Package
        run: |
          tar -C kexts -czf freebsd-kexts-${{ matrix.target }}.tar.gz .
          tar tzf freebsd-kexts-${{ matrix.target }}.tar.gz | awk -F/ 'NF > 1 && $2 != "" {print $2}' | sort -u
          ls -lh freebsd-kexts-${{ matrix.target }}.tar.gz

      - name: Upload kexts artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-kexts-${{ matrix.target }}
          path: freebsd-kexts-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Refresh the rolling `continuous` release from main. PRs build but never
  # publish.
  publish:
    name: publish continuous
    needs: kexts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download kexts
        uses: actions/download-artifact@v4
        with:
          pattern: freebsd-kexts-*
          merge-multiple: true
          path: out

      - name: Publish to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous kernel extensions build
          body: |
            Rolling build of the FreeBSD-derived kexts, refreshed on every successful `main` build.
            `freebsd-kexts-<arch>.tar.gz` holds the kext bundles (amd64: IntelWiFi with its
            iwlwifi firmware, autofs; arm64: autofs), unpacked into /System/Library/Extensions and
            packaged by nextbsd-pkg as `NextBSD-kernel-extensions`.

            Every kext carries `NBSDKernelABIVersion` in its Info.plist: the nextbsd-kernel
            KERNEL-ABI-VERSION it was built for (e.g. `27.0`), and the legacy `NBSDKernelBuildID`,
            that kernel's KERNEL-BUILD-ID. `System.kext` (`org.nextbsd.kernel`, codeless)
            describes that kernel: its version (CFBundleVersion, e.g. `27.0.0`), ABI version,
            build ID and the modules compiled into it.

            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
