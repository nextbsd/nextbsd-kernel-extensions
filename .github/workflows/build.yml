name: Build NextBSD Kernel Extensions
on:
  # A chain run: nextbsd-kernel published a new kernel (freebsd-src's daily sync
  # when releng/15.1 moves, or its Sync Fork with `force`). A kernel merge alone
  # does not dispatch (nextbsd-kernel#324); rebuild by hand then.
  repository_dispatch:
    types: [kernel-updated]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'tools/**'
      - '*/kext.env'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'tools/**'
      - '*/kext.env'
  workflow_dispatch:
    inputs:
      fbsd_sha:
        description: 'Pinned FreeBSD SHA for the toolchain image tag (blank = latest)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # linux-firmware release the bundled firmware comes from (KEXT_FIRMWARE).
  LINUX_FIRMWARE_TAG: "20260519"

jobs:
  # The FreeBSD-derived kexts (E21, nextbsd/nextbsd#554). Each top-level
  # directory with a kext.env is one kext; tools/kexts.sh reads them, so this
  # workflow names no kext, module or source path. Moved from
  # nextbsd-kernel-extensions-graphics' `modules` job and its IntelWiFi and
  # IntelEthernet publish steps, which built the whole module tree and shipped
  # it as nextbsd-modules-<arch>.tar.gz. This builds only the modules a kext
  # ships (MODULES_OVERRIDE) and publishes only kexts.
  #
  # A kext ships on the arches its kext.env lists; each arch builds and
  # publishes its own set, freebsd-kexts-<arch>.tar.gz.
  modules:
    name: modules (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            target_arch: amd64
          - target: arm64
            target_arch: aarch64
    container:
      # Same per-arch toolchain image the kernel was built in, by tag only.
      # Cross-builds on the x86_64 runner (no emulation).
      image: ghcr.io/nextbsd/nextbsd-toolchain:${{ matrix.target }}-${{ (github.event.client_payload.fbsd_sha || inputs.fbsd_sha) && format('fbsd-{0}', github.event.client_payload.fbsd_sha || inputs.fbsd_sha) || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: nbkx

      # The kernel SDK from nextbsd-kernel's `continuous` release
      # (nextbsd-kernel#327): the kernel's headers, generated options and
      # KERNEL-BUILD-ID. No kernel source or obj tree, no relink (#2). Leaves
      # the ID in /tmp/kernel-build-id and KERNEL_SDK in the environment.
      - name: Kernel SDK
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_SHA: ${{ github.event.client_payload.sha }}
        run: nbkx/tools/fetch-kernel-sdk.sh ${{ matrix.target }}

      # buildenv needs the host build tools (bmake, the legacy and bootstrap
      # tools) that make.py builds into /usr/obj. They come from the toolchain
      # image's freebsd-src, not from the kernel.
      - name: Host build tools
        run: |
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET="${{ matrix.target }}" \
            TARGET_ARCH="${{ matrix.target_arch }}" \
            kernel-toolchain -j"$(nproc)"

      # Each kext's module, from freebsd-src's sys/modules/<module>, against the
      # SDK: SYSDIR for the kernel's (patched) headers and kmod.mk, KERNBUILDDIR
      # for its opt_*.h and opt_global.h, as buildkernel would pass.
      - name: Build the kexts' modules
        run: |
          MODS=$(nbkx/tools/kexts.sh modules ${{ matrix.target }})
          echo "modules: $MODS"
          cd /usr/src
          for m in $MODS; do
            echo "==> sys/modules/$m"
            ./tools/build/make.py \
              --cross-bindir="${CROSS_BINDIR}" \
              TARGET="${{ matrix.target }}" \
              TARGET_ARCH="${{ matrix.target_arch }}" \
              buildenv BUILDENV_SHELL="make -C /usr/src/sys/modules/$m -j$(nproc) SYSDIR=$KERNEL_SDK/sys KERNBUILDDIR=$KERNEL_SDK/obj"
          done

      # Each kext's .ko, and its personalities generated from the same source
      # tree the module was compiled from.
      - name: Collect each kext's module and personalities
        run: |
          nbkx/tools/kexts.sh inputs ${{ matrix.target }} /usr/src /usr/obj kext-inputs
          cp /tmp/kernel-build-id/KERNEL-BUILD-ID kext-inputs/

      - name: Upload kext inputs
        uses: actions/upload-artifact@v4
        with:
          name: kext-inputs-${{ matrix.target }}
          path: kext-inputs
          if-no-files-found: error

  kexts:
    name: kexts (${{ matrix.target }})
    needs: modules
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kext inputs
        uses: actions/download-artifact@v4
        with:
          name: kext-inputs-${{ matrix.target }}
          path: kext-inputs

      # Bundle firmware, inject personalities, stamp NBSDKernelBuildID.
      - name: Wrap the kexts
        run: tools/kexts.sh wrap ${{ matrix.target }} kext-inputs kexts

      - name: Validate the kext bundles
        run: |
          python3 - kexts "$(cat kext-inputs/KERNEL-BUILD-ID)" <<'PY'
          import os, plistlib, sys
          root, kbid = sys.argv[1], sys.argv[2]
          names = sorted(n for n in os.listdir(root) if n.endswith('.kext'))
          assert names, "no kexts"
          for n in names:
              d = plistlib.load(open(f"{root}/{n}/Contents/Info.plist", 'rb'))
              cls = n[:-5]
              exe = f"{root}/{n}/Contents/MacOS/{d['CFBundleExecutable']}"
              assert os.path.isfile(exe), f"{n}: no executable {exe}"
              assert d['CFBundleIdentifier'].startswith('org.nextbsd.'), d['CFBundleIdentifier']
              assert d.get('NBSDKernelBuildID') == kbid, f"{n}: NBSDKernelBuildID {d.get('NBSDKernelBuildID')} != {kbid}"
              p = d.get('IOKitPersonalities', {}).get(cls)
              ids = p['IOPCIPrimaryMatch'].split() if p else []
              print(f"{n}: {d['CFBundleIdentifier']}, {len(ids)} device ids, built for {kbid}")
          PY

      # Only kexts go in the asset: it is unpacked straight into
      # /System/Library/Extensions.
      - name: Package
        run: |
          tar -C kexts -czf freebsd-kexts-${{ matrix.target }}.tar.gz .
          tar tzf freebsd-kexts-${{ matrix.target }}.tar.gz | awk -F/ 'NF > 1 && $2 != "" {print $2}' | sort -u
          ls -lh freebsd-kexts-${{ matrix.target }}.tar.gz

      - name: Upload kexts artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-kexts-${{ matrix.target }}
          path: freebsd-kexts-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Refresh the rolling `continuous` release from main. PRs build but never
  # publish.
  publish:
    name: publish continuous
    needs: kexts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download kexts
        uses: actions/download-artifact@v4
        with:
          pattern: freebsd-kexts-*
          merge-multiple: true
          path: out

      - name: Publish to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous kernel extensions build
          body: |
            Rolling build of the FreeBSD-derived kexts, refreshed on every successful `main` build.
            `freebsd-kexts-<arch>.tar.gz` holds the kext bundles (amd64: IntelWiFi with its
            iwlwifi firmware, autofs; arm64: autofs), unpacked into /System/Library/Extensions and
            packaged by nextbsd-pkg as `NextBSD-kernel-extensions`.

            Every kext carries `NBSDKernelBuildID` in its Info.plist: the nextbsd-kernel
            KERNEL-BUILD-ID it was built for.

            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
