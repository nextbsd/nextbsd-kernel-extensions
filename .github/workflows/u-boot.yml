name: U-Boot (Raspberry Pi 5)

# u-boot.bin for the Raspberry Pi 5 family: the first stage of
# firmware -> U-Boot -> FreeBSD loader.efi -> /boot/kernel (nextbsd/nextbsd#687).
# Sources and patches are pinned in u-boot/SOURCES. This workflow is separate
# from build.yml and touches no kext: it runs only for changes under u-boot/.

on:
  push:
    branches: [main]
    paths: ['u-boot/**', '.github/workflows/u-boot.yml']
  pull_request:
    paths: ['u-boot/**', '.github/workflows/u-boot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build u-boot.bin (rpi_arm64)
    # Pinned, not ubuntu-latest: the cross compiler is part of the build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the aarch64 cross toolchain and U-Boot's host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gcc-aarch64-linux-gnu make bc bison flex \
            libssl-dev libgnutls28-dev uuid-dev \
            python3 python3-dev python3-setuptools python3-pyelftools swig \
            device-tree-compiler
          aarch64-linux-gnu-gcc --version | head -1

      - name: Build
        run: sh u-boot/build-u-boot.sh "$RUNNER_TEMP/u-boot-work" "$RUNNER_TEMP/u-boot-out"

      # The diagnostic build: boots nothing, shows on the HDMI screen how far
      # U-Boot gets (u-boot/nextbsd_rpi_arm64_probe_fragment).
      - name: Build the probe
        run: sh u-boot/build-u-boot.sh "$RUNNER_TEMP/u-boot-probe-work" "$RUNNER_TEMP/u-boot-probe-out" probe

      - name: Upload u-boot.bin
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-rpi5
          path: |
            ${{ runner.temp }}/u-boot-out/u-boot.bin
            ${{ runner.temp }}/u-boot-out/u-boot.config
            ${{ runner.temp }}/u-boot-out/u-boot-initial-env
            ${{ runner.temp }}/u-boot-out/BUILDINFO
          if-no-files-found: error

      - name: Upload the probe u-boot.bin
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-rpi5-probe
          path: |
            ${{ runner.temp }}/u-boot-probe-out/u-boot.bin
            ${{ runner.temp }}/u-boot-probe-out/u-boot.config
            ${{ runner.temp }}/u-boot-probe-out/u-boot-initial-env
            ${{ runner.temp }}/u-boot-probe-out/BUILDINFO
          if-no-files-found: error

  # On main, publish u-boot.bin for nextbsd-pkg and the nextbsd image build
  # (#41). Its own release, not the kexts' `continuous`: build.yml rewrites
  # that release's notes on every publish. The asset names are stable, so
  # each publish replaces the last.
  publish:
    name: publish continuous-u-boot
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download u-boot.bin
        uses: actions/download-artifact@v4
        with:
          name: u-boot-rpi5
          path: out

      - name: Check it
        run: |
          ls -l out
          test -s out/u-boot.bin && test -s out/BUILDINFO
          ( cd out && sha256sum u-boot.bin > u-boot.bin.sha256 && cat u-boot.bin.sha256 )

      - name: Publish to continuous-u-boot
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous-u-boot
          name: Continuous U-Boot build (Raspberry Pi 5)
          body: |
            Rolling build of `u-boot.bin` for the Raspberry Pi 5 family, refreshed on every
            `main` change under `u-boot/`. It is the first stage of
            firmware -> U-Boot -> FreeBSD `loader.efi` -> `/boot/kernel.RPI5/kernel`
            (nextbsd/nextbsd#687) and goes on the FAT partition next to `config.txt`
            (`kernel=u-boot.bin`). Sources and patches are pinned in `u-boot/SOURCES`;
            `BUILDINFO` records them.

            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            out/u-boot.bin
            out/u-boot.bin.sha256
            out/BUILDINFO
